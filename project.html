<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="project-detail-page">
  <div class="background-layer"></div>
  <div class="background-layer layer-two"></div>

  <main class="project-detail-shell">
    <div class="project-detail-header">
      <a href="index.html">← Back to portfolio</a>
    </div>

    <section class="project-detail-layout reveal">
      <div class="project-detail-gallery" id="project-detail-gallery"></div>

      <div class="project-detail-info">
        <p class="eyebrow">Project overview</p>
        <h1 id="project-detail-title">Project title</h1>
        <div class="project-detail-tags" id="project-detail-tags"></div>
        <p id="project-detail-overview"></p>
        <ul id="project-detail-features"></ul>
        <div class="project-detail-actions">
          <a id="project-live-link" class="btn btn-primary" href="#" target="_blank" rel="noreferrer">Open live project</a>
          <a id="project-github-link" class="btn btn-secondary" href="#" target="_blank" rel="noreferrer">View GitHub</a>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
